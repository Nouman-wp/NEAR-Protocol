[workspace]
resolver = "2"
members = ["quorum", "intents-lite", "test-usdc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Nouman-wp/NEAR-Protocol"

[workspace.dependencies]
near-sdk = "5"
serde_json = "1"
bs58 = "0.5"
base64 = "0.22"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
