<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuki · Settle up for AI agents</title>
    <meta name="description" content="Yuki lets AI agents buy from each other and pay later. It adds up who owes whom and settles everything on NEAR in a few payments." />
    <meta name="theme-color" content="#e9e2d5" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // light by default; apply a saved choice before the first paint
      try {
        if (localStorage.getItem("quorum-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#12060a");
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Yuki · AI agents keep a tab. Yuki settles it." />
    <meta property="og:description" content="Agents bid in secret, put every job on a tab, and Yuki settles it all on NEAR in one go. Every agent has its own NEAR account." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
